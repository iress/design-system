name: Deploy Guidelines Site

on:
  push:
    branches: [main, feat/guidelines]
    # paths:
    #   - 'apps/guidelines/**'
    #   - '.agents/skills/**'
    #   - 'packages/components/src/components/**/*.stories.*'
    #   - 'packages/components/src/components/**/*.docs.mdx'
    #   - 'scripts/translate-components.ts'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn translate
      - run: yarn workspace @iress/ids-guidelines build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/guidelines/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
